[project]
name = "shin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.26.0.51",
    "ollama>=0.6.2",
    "onnxruntime-gpu>=1.30.0",
    "openwakeword>=0.4.0",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "transcribe-cpp>=0.2.4",
]

[project.optional-dependencies]
speaker-verification = ["speechbrain>=1.0.3"]

[project.scripts]
shin = "shin:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
