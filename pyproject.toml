[project]
name = "adam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.3",
    "ollama>=0.6.2",
    "openwakeword>=0.4.0",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pillow>=11.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "transcribe-cpp>=0.2.4",
]

[project.optional-dependencies]
runtime-cpu = ["onnxruntime>=1.20.0", "torch>=2.0", "torchaudio>=2.11.0"]
runtime-nvidia = [
    "nvidia-cublas-cu12>=12.9.2.10",
    # cuDNN 9.26 dropped Pascal (compute capability 6.1); 9.10 keeps GTX 10xx support.
    "nvidia-cudnn-cu12>=9.10,<9.11",
    "onnxruntime-gpu>=1.20.0",
    "torch>=2.0",
    "torchaudio>=2.11.0",
]
speaker-verification = ["speechbrain>=1.0.3"]
nemotron-diarization = [
    "librosa>=0.11.0",
    "transformers @ git+https://github.com/huggingface/transformers.git",
]
intent-routing = [
    "tokenizers>=0.21.0",
    "huggingface-hub>=0.30.0",
]
browser-control = ["playwright>=1.50.0"]
computer-ocr = ["rapidocr>=3.9.0"]

[project.scripts]
adam = "adam:main"

[tool.uv]
conflicts = [[{ extra = "runtime-cpu" }, { extra = "runtime-nvidia" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "runtime-cpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "runtime-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
eval = [
    "pyarrow>=25.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
